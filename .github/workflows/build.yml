name: build

# Shared build used by ci.yml (every push / pull request) and release.yml
# (version tags). Builds the app on Windows and macOS, runs the unit tests,
# checks and tests the plugin; with `package: true` it also packages the
# app and plugin as zips and uploads them as artifacts.

on:
  workflow_call:
    inputs:
      package:
        description: Package the app and plugin and upload the zips
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # libmpv (DLL + headers) from shinchiro's Windows builds of mpv. Without
      # packaging, CMake downloads just the headers instead.
      - name: Download libmpv
        if: inputs.package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } `
            https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "No mpv-dev-x86_64 asset found in $($rel.tag_name)" }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev | Out-Null

      - name: Configure
        run: >
          cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNP_BUILD_TESTS=ON
          ${{ inputs.package && format('-DMPV_INCLUDE_DIR="{0}/mpv-dev/include"', github.workspace) || '' }}

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        if: inputs.package
        shell: pwsh
        run: |
          $dist = "dist/StashNativePlayer"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/StashNativePlayer.exe $dist/
          windeployqt --release --qmldir app/qml --no-translations $dist/StashNativePlayer.exe
          $mpvDll = Get-ChildItem mpv-dev -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $mpvDll) { throw "libmpv-2.dll not found in mpv-dev" }
          Copy-Item $mpvDll.FullName $dist/
          Copy-Item README.md, CHANGELOG.md $dist/
          Compress-Archive -Path $dist -DestinationPath dist/StashNativePlayer-windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: StashNativePlayer-windows-x64
          path: dist/StashNativePlayer-windows-x64.zip
          compression-level: 0

  macos:
    runs-on: macos-15 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: clang_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      # libmpv and its dependencies from Homebrew, bundled into the app by
      # dylibbundler. Without packaging, CMake downloads just the headers.
      - name: Install build tools
        run: brew install ninja ${{ inputs.package && 'mpv dylibbundler' || '' }}

      - name: Configure
        run: >
          cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSNP_BUILD_TESTS=ON
          -DCMAKE_OSX_ARCHITECTURES=arm64
          ${{ inputs.package && '-DMPV_INCLUDE_DIR="$(brew --prefix)/include"' || '' }}

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        if: inputs.package
        run: |
          set -euo pipefail
          app=build/StashNativePlayer.app
          macdeployqt "$app" -qmldir=app/qml
          fw="$app/Contents/Frameworks"
          mkdir -p "$fw"
          cp "$(brew --prefix)/lib/libmpv.2.dylib" "$fw/"
          chmod u+w "$fw/libmpv.2.dylib"
          install_name_tool -id @rpath/libmpv.2.dylib "$fw/libmpv.2.dylib"
          dylibbundler -of -b -x "$fw/libmpv.2.dylib" -d "$fw" -p @executable_path/../Frameworks/
          # dylibbundler adds its rpath to libmpv a second time; since macOS
          # 15.4 dyld refuses to load a library with a duplicate LC_RPATH, and
          # the app would silently fall back to (or lack) Homebrew's libmpv.
          rpaths() { otool -l "$1" | awk '/LC_RPATH/ { getline; getline; print $2 }'; }
          for f in "$fw"/*.dylib; do
            for p in $(rpaths "$f" | sort | uniq -d); do
              while [ "$(rpaths "$f" | grep -cxF "$p")" -gt 1 ]; do
                install_name_tool -delete_rpath "$p" "$f"
              done
            done
          done
          for f in "$fw"/*.dylib; do
            if [ -n "$(rpaths "$f" | sort | uniq -d)" ]; then
              echo "duplicate LC_RPATH left in $f" >&2; exit 1
            fi
          done
          # nothing in the bundle may still point into Homebrew
          if otool -L "$fw"/*.dylib | grep -E "^\s+$(brew --prefix)/"; then
            echo "Homebrew paths left in bundled libraries" >&2; exit 1
          fi
          # ad-hoc signature (required on Apple Silicon; not notarized)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" dist/StashNativePlayer-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: StashNativePlayer-macos-arm64
          path: dist/StashNativePlayer-macos-arm64.zip
          compression-level: 0

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin scripts
        run: |
          node --check plugin/StashNativePlayer/native-player.js
          python3 -m py_compile plugin/StashNativePlayer/snp_captions.py
      - name: Plugin tests
        run: python3 -m unittest discover -s plugin/tests -v
      - name: Zip plugin
        if: inputs.package
        run: cd plugin && zip -r ../StashNativePlayer-plugin.zip StashNativePlayer -x '*/__pycache__/*'
      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: StashNativePlayer-plugin
          path: StashNativePlayer-plugin.zip
          compression-level: 0
