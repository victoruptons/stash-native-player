name: Stash Native Player
description: >-
  Plays scenes with an embedded native (mpv) player when Stash is opened in the
  Stash Native Player desktop app. In a normal browser the stock player is used.
version: 0.1.1
ui:
  javascript:
    - native-player.js
  css:
    - native-player.css

# Server side: saves subtitles generated by the app next to the video (see
# snp_captions.py). Needs Python 3 on the Stash server (standard library only).
exec:
  - python
  - "{pluginDir}/snp_captions.py"
interface: raw
